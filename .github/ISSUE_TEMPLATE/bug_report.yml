name: Bug report
description: Report a reproducible problem with Apollo for Twenty
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: twenty-version
    attributes:
      label: Twenty version
      placeholder: "2.42.6"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys and other secrets before pasting.
